<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DocuPing - Your Personal Student Document Companion" />
  <title>DocuPing - Document Management</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Mobile Navigation Bar (visible <= 768px) -->
  <div class="mobile-topbar">
    <button type="button" class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Open menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="4" y1="18" x2="20" y2="18"></line>
      </svg>
    </button>
    <div style="font-weight: 700; font-size: 1.125rem;">DocuPing</div>
    <div class="user-avatar" style="width: 32px; height: 32px; font-size: 0.875rem;">A</div>
  </div>

  <div class="app-shell">
    <!-- AppSidebar Mount Point -->
    <div id="sidebar-mount"></div>

    <!-- Main Content Area -->
    <main class="app-main" id="main-content">
      <div class="app-container">
        <!-- TopBar Mount Point (Search, Notifications, Profile) -->
        <div id="topbar-mount"></div>

        <!-- Page Header -->
        <header class="page-header" style="display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 class="page-header-title">Good Evening, Ananya!</h1>
            <p class="page-header-subtitle">Your documents, under control.</p>
          </div>
          <div style="display: flex; gap: 0.75rem;">
            <button type="button" class="btn btn-secondary btn-sm" id="btn-trigger-toast">Test Toast</button>
            <button type="button" class="btn btn-primary btn-sm" id="btn-trigger-modal">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              + Add Reminder
            </button>
          </div>
        </header>

        <!-- Metric Overview Cards (Screenshot 3) -->
        <section class="grid-2" aria-label="Document Statistics" style="margin-bottom: 2rem;">
          <!-- Document Readiness Donut Card -->
          <article class="stat-card">
            <div class="stat-card-content">
              <span class="stat-card-label">Document Readiness</span>
              <span class="stat-card-value">78%</span>
              <span class="stat-card-subtext">You're almost there!</span>
            </div>
            <div class="stat-card-graphic" aria-hidden="true">
              <svg class="progress-ring" width="68" height="68" viewBox="0 0 68 68">
                <circle class="progress-ring-circle-bg" stroke-width="7" fill="transparent" r="28" cx="34" cy="34" />
                <circle class="progress-ring-circle-fill" stroke-width="7" stroke-dasharray="175.9" stroke-dashoffset="38.7" fill="transparent" r="28" cx="34" cy="34" />
              </svg>
            </div>
          </article>

          <!-- Documents Saved Stat Card -->
          <article class="stat-card">
            <div class="stat-card-content">
              <span class="stat-card-label">Documents Saved</span>
              <span class="stat-card-value">24</span>
              <span class="stat-card-subtext">Across your vaults</span>
            </div>
            <div class="stat-card-graphic" aria-hidden="true">
              <div class="stat-badge-circle">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
                </svg>
              </div>
            </div>
          </article>
        </section>

        <!-- Your Vaults Section (Screenshot 3) -->
        <section aria-labelledby="vaults-heading">
          <h2 class="section-title" id="vaults-heading">Your Vaults</h2>
          <div class="grid-4" id="vaults-grid">
            <!-- Populated via JS VaultCard Component -->
          </div>
        </section>

        <!-- Recent Documents Preview & Status Badges (Screenshots 4, 5, 8) -->
        <section aria-labelledby="recent-docs-heading" style="margin-top: 2.5rem;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <h2 class="section-title" id="recent-docs-heading" style="margin: 0;">Recent Documents</h2>
              <span class="status-badge status-badge-upcoming">Upcoming</span>
              <span class="status-badge status-badge-soon">Soon</span>
            </div>
            <a href="pages/my-vault.html" class="text-sm font-semibold" style="color: var(--color-primary);">View All &rarr;</a>
          </div>

          <div class="grid-3" id="docs-grid">
            <!-- Populated via JS DocumentCard Component -->
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Main ES6 Application Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
