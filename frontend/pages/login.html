<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to DocuPing - Your Personal Student Document Companion" />
  <title>Login - DocuPing</title>

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/auth.css?v=1.1" />
</head>

<body>
  <div class="auth-layout">
    <!-- Left Brand Banner (Matches Screenshot 1) -->
    <aside class="auth-banner" aria-label="DocuPing Brand Overview">
      <div class="auth-banner-header">
        <div class="auth-brand-logo" aria-hidden="true">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z">
            </path>
            <path d="m9 13 2 2 4-4"></path>
          </svg>
        </div>
        <h1 class="auth-brand-title">DocuPing</h1>
        <p class="auth-brand-subtitle">Your Personal Student Document Companion</p>
      </div>

      <div class="auth-banner-tagline">
        Organise &bull; Track &bull; Stay Prepared
      </div>

      <div class="auth-banner-watermark" aria-hidden="true">
        <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
          <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </svg>
      </div>
    </aside>

    <!-- Right Form Area -->
    <main class="auth-content">
      <div class="auth-card">
        <!-- Top Navigation Tabs -->
        <nav class="auth-tabs-wrapper" aria-label="Authentication Options">
          <div class="auth-tabs">
            <a href="login.html" class="auth-tab active" aria-current="page">Login</a>
            <a href="signup.html" class="auth-tab">Sign Up</a>
          </div>
        </nav>

        <!-- Form Heading -->
        <header class="auth-header">
          <h2 class="auth-title">Welcome Back!</h2>
          <p class="auth-subtitle">Let's get you back on track</p>
        </header>

        <!-- Login Form -->
        <form id="login-form" class="auth-form" novalidate>
          <!-- Email Field -->
          <div class="auth-input-group">
            <div class="auth-input-wrapper">
              <span class="auth-input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
              </span>
              <input type="email" id="login-email" name="email" class="auth-input" placeholder="Email Address"
                autocomplete="email" required />
            </div>
            <span class="field-error-msg" role="alert"></span>
          </div>

          <!-- Password Field -->
          <div class="auth-input-group">
            <div class="auth-input-wrapper">
              <span class="auth-input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input type="password" id="login-password" name="password" class="auth-input has-toggle"
                placeholder="Password" autocomplete="current-password" required />
              <button type="button" class="auth-password-toggle" data-toggle-target="login-password"
                aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <span class="field-error-msg" role="alert"></span>
          </div>

          <!-- Options Row: Remember Me & Forgot Password -->
          <div class="auth-row">
            <label class="checkbox-label" for="login-remember">
              <input type="checkbox" id="login-remember" class="checkbox-input" />
              <span>Remember me</span>
            </label>
            <a href="#forgot" class="auth-link" id="link-forgot-password">Forgot Password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-auth-submit" id="login-submit-btn">
            <span>Login</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <!-- Social Auth Divider -->
        <div class="auth-divider">
          <span>or continue with</span>
        </div>

        <!-- Social Buttons -->
        <div class="auth-social-group">
          <button type="button" class="btn-social" data-social="google" aria-label="Sign in with Google">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4"
                d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z">
              </path>
              <path fill="#34A853"
                d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z">
              </path>
              <path fill="#FBBC05"
                d="M5.28 14.27a7.17 7.17 0 0 1 0-4.54V6.58H1.25a11.96 11.96 0 0 0 0 10.84l4.03-3.15Z"></path>
              <path fill="#EA4335"
                d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z">
              </path>
            </svg>
          </button>
          <button type="button" class="btn-social" data-social="github" aria-label="Sign in with GitHub">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#141E19" aria-hidden="true">
              <path fill-rule="evenodd" clip-rule="evenodd"
                d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z">
              </path>
            </svg>
          </button>
        </div>

        <!-- Footer Link -->
        <div class="auth-footer">
          New here? <a href="signup.html" class="auth-footer-link">Create an Account</a>
        </div>
      </div>
    </main>
  </div>

  <!-- Authentication JavaScript Module -->
  <script type="module" src="../js/auth.js"></script>
</body>

</html>
