<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="My Vault - DocuPing. All your important documents, organised in one place." />
  <title>My Vault - DocuPing</title>

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/vault.css" />
</head>
<body>
  <!-- Mobile Navigation Bar (Visible only on screens <= 768px) -->
  <div class="mobile-topbar" role="banner">
    <button type="button" class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Open menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="4" y1="18" x2="20" y2="18"></line>
      </svg>
    </button>
    <div style="font-weight: 700; font-size: 1.125rem; letter-spacing: -0.01em;">DocuPing</div>
    <a href="settings.html" class="user-avatar" style="width: 32px; height: 32px; font-size: 0.8125rem;" aria-label="Profile Settings">A</a>
  </div>

  <div class="app-shell">
    <!-- AppSidebar Mount Point -->
    <div id="sidebar-mount"></div>

    <!-- Main Content Area -->
    <main class="app-main" id="main-content">
      <div class="app-container">

        <!-- 1. Top Bar Search & Actions (Matches Screenshot 4) -->
        <header class="vault-topbar">
          <div class="vault-topbar-search">
            <div class="vault-search-box">
              <span class="vault-search-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.35-4.35"></path>
                </svg>
              </span>
              <input
                type="search"
                class="vault-search-input"
                id="vault-search-input"
                placeholder="Search documents..."
                aria-label="Search documents by name or category"
              />
              <button type="button" class="vault-search-clear" id="vault-search-clear" aria-label="Clear search input">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 1rem;">
            <a href="reminders.html" class="topbar-btn" aria-label="Reminders and notifications">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
              </svg>
            </a>
            <a href="settings.html" class="user-avatar" aria-label="Profile Settings">A</a>
          </div>
        </header>

        <!-- 2. Page Header & Actions -->
        <div class="vault-header">
          <div class="vault-title-group">
            <div class="vault-title-row">
              <h1 class="vault-title">My Vault</h1>
              <span class="vault-count-badge" id="vault-count-badge">8 documents</span>
              <div class="vault-actions vault-actions-compact">
                <button type="button" class="btn btn-primary btn-sm" id="btn-upload-doc">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                  <span>+ Upload Document</span>
                </button>
                <button type="button" class="btn btn-track btn-sm" id="btn-track-doc">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>
                  <span>+ Track Only</span>
                </button>
              </div>
            </div>
            <p class="vault-subtitle">Your organised document space</p>
          </div>
        </div>

        <!-- 3. Filter & Sort Toolbar (Category Pills matching Screenshot 4) -->
        <div class="vault-toolbar">
          <div class="vault-filter-pills" id="vault-filter-pills" role="tablist" aria-label="Filter documents by category">
            <button type="button" class="vault-filter-pill is-active" data-category="all" role="tab" aria-selected="true">
              All
            </button>
            <button type="button" class="vault-filter-pill" data-category="academic" role="tab" aria-selected="false">
              Academic
            </button>
            <button type="button" class="vault-filter-pill" data-category="career" role="tab" aria-selected="false">
              Career
            </button>
            <button type="button" class="vault-filter-pill" data-category="achievements" role="tab" aria-selected="false">
              Achievements
            </button>
            <button type="button" class="vault-filter-pill" data-category="health" role="tab" aria-selected="false">
              Health
            </button>
            <button type="button" class="vault-filter-pill" data-category="finance" role="tab" aria-selected="false">
              Finance
            </button>
          </div>

          <div class="vault-sort-group">
            <label for="vault-sort-select" class="vault-sort-label">Sort by:</label>
            <select id="vault-sort-select" class="vault-sort-select" aria-label="Sort documents">
              <option value="recent">Recently Added</option>
              <option value="name">Name (A-Z)</option>
              <option value="expiry">Expiry Date</option>
            </select>
          </div>
        </div>

        <!-- 4. Document Grid Container -->
        <div class="vault-grid" id="vault-docs-grid" role="region" aria-label="Vault documents grid">
          <!-- Populated dynamically via vault.js -->
        </div>

      </div>
    </main>
  </div>

  <!-- Page Logic Script -->
  <script type="module">
    import { createSidebar, initSidebar } from "../js/components/sidebar.js";
    import { initVault } from "../js/vault.js";

    document.addEventListener("DOMContentLoaded", () => {
      const mount = document.getElementById("sidebar-mount");
      if (mount) {
        mount.innerHTML = createSidebar("my-vault", "../");
        initSidebar();
      }
      initVault();
    });
  </script>
</body>
</html>
